<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Home & Family{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; }
    nav { width: 180px; padding: 1rem; border-right: 1px solid #ddd; }
    nav a { display: block; margin-bottom: 0.5rem; color: #333; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { flex: 1; padding: 1.5rem; }
    .needs-attention { color: #b00020; }
    .recently-changed { background: #fff8dc; }
    nav.subnav { width: auto; padding: 0; margin-bottom: 1rem; border-right: none; display: flex; gap: 1rem; }
    nav.subnav a { display: inline; margin-bottom: 0; }
    nav.subnav a.active { font-weight: bold; text-decoration: underline; }
    .chart { margin-bottom: 1.5rem; }
    .chart h3 { margin-bottom: 0.5rem; font-size: 1rem; }
    .chart-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; margin-bottom: 0.15rem; }
    .chart-label { width: 4.5rem; flex-shrink: 0; }
    .chart-bar-track { flex: 1; background: #f0f0f0; height: 1rem; overflow: hidden; }
    .chart-bar-fill { background: #3a6ea5; height: 100%; }
    .chart-value { width: 5rem; text-align: right; flex-shrink: 0; }
    .review-table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    .review-table th, .review-table td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
    .review-table th { font-size: 0.8rem; text-transform: uppercase; color: #888; }
    /* ---- Overview screen: ported near-verbatim from the approved v13
       mockup, .superpowers/brainstorm/1227663-1787308748/content/
       overview-v13.html -- class names (fc-*) match that file exactly so
       this stays a literal reproduction, not a reinterpretation. ---- */
    .fc-page { width: 80%; margin: 0 auto; }
    .fc-frame { background: #ffffff; border: 1px solid #e2e2e2; border-radius: 10px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a1a1a; }
    .fc-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid #ececec; }
    .fc-brand { font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: #1a1a1a; }
    .fc-period { display: flex; align-items: center; gap: 18px; font-size: 13px; color: #555; }
    .fc-period .pill { padding: 5px 11px; border: 1px solid #ddd; border-radius: 6px; }

    .fc-kpi-group { padding: 16px 22px 8px; }
    .fc-kpi-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 10px; }
    .fc-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .fc-card { display: block; text-decoration: none; color: #1a1a1a; border: 1px solid #ececec; border-radius: 8px; padding: 16px; cursor: pointer; }
    .fc-card:hover { background: #fafafa; }
    .fc-card.position { background: #fafbfc; }
    .fc-card.position:hover { background: #f2f4f6; }
    .fc-card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; display: flex; justify-content: space-between; align-items: center; }
    .fc-card-label .go { color: #ccc; font-size: 12px; text-transform: none; }
    .fc-card-val { font-size: 23px; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
    .fc-card-caption { font-size: 11px; color: #999; margin-top: 2px; }

    .fc-bars { position: relative; display: flex; flex-direction: column; margin-top: 12px; }
    .fc-bar-area { height: 28px; display: flex; align-items: flex-end; position: relative; z-index: 1; }
    .fc-bar-area.bidirectional { height: 40px; align-items: stretch; }
    .fc-bidirectional-zero-line { position: absolute; top: 20px; left: 0; right: 0; height: 1px; background: #ddd; z-index: 0; }
    .fc-bars-zero-line { height: 1px; background: #ddd; position: relative; z-index: 1; }
    .fc-bar-plabels { height: 11px; display: flex; position: relative; z-index: 1; }
    .fc-bar-plabel { flex: 1; text-align: center; font-size: 9px; color: #bbb; line-height: 11px; }
    .fc-bar-slot { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .fc-bar-zone-up { height: 20px; display: flex; justify-content: center; align-items: flex-end; }
    .fc-bar-zone-down { height: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .fc-bar { width: 62%; border-radius: 1px 1px 0 0; background: #1f8a4c; margin: 0 auto; }
    .fc-bar.red { background: #c0392b; }
    .fc-bar.outline {
      border: 1.5px solid #1a1a1a;
      width: calc(62% - 3px);
      background: repeating-linear-gradient(45deg, rgba(26,26,26,0.45) 0, rgba(26,26,26,0.45) 2px, transparent 2px, transparent 6px);
    }
    .fc-bars-highlight { position: absolute; top: -6px; bottom: -6px; right: 0; width: 28.57%; background: #f0f0f0; border-radius: 4px; z-index: 0; }
    .fc-no-history { font-size: 12px; color: #999; padding: 8px 0; text-align: center; margin-top: 12px; border-top: 1px solid #ececec; }

    .fc-yc { margin: 0; padding: 14px 16px; background: #fafbfc; border: 1px solid #ececec; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: #1a1a1a; cursor: pointer; }
    .fc-yc:hover { background: #f2f4f6; }
    .fc-yc-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; }
    .fc-yc-val { font-size: 20px; font-weight: 700; margin-top: 6px; letter-spacing: -0.01em; }
    .fc-yc-val span { font-weight: 400; color: #888; font-size: 13px; }
    .fc-yc-bar { height: 8px; background: #ececec; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .fc-yc-fill { height: 100%; background: #4a6fa5; }
    .fc-yc-sub { font-size: 11px; color: #888; margin-top: 6px; }
    .fc-yc-empty { font-size: 13px; color: #999; }

    .fc-insight { display: flex; gap: 10px; align-items: flex-start; padding: 16px 22px; background: #fbf8ef; border-top: 1px solid #ececec; border-bottom: 1px solid #ececec; font-size: 14px; line-height: 1.5; }

    .fc-section { padding: 22px; border-bottom: 1px solid #ececec; }
    .fc-section:last-child { border-bottom: none; }
    .fc-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .fc-pills { display: flex; gap: 6px; }
    .fc-pills a { font-size: 11px; padding: 3px 9px; border-radius: 20px; color: #888; border: 1px solid #e2e2e2; text-decoration: none; }
    .fc-pills a.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    .fc-cashflow { display: flex; align-items: flex-end; gap: 0; height: 150px; padding-top: 10px; width: 100%; }
    .fc-cf-col { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; height: 100%; justify-content: flex-end; min-width: 0; }
    .fc-cf-bars { display: flex; gap: 3%; align-items: flex-end; height: 100%; width: 70%; }
    .fc-cf-bar { flex: 1 1 0; border-radius: 2px 2px 0 0; min-width: 0; }
    .fc-cf-bar.income { background: #1f8a4c; }
    .fc-cf-bar.expense { background: #c0392b; }
    .fc-cf-month { font-size: 10px; color: #999; margin-top: 6px; }
    .fc-cf-legend { display: flex; gap: 16px; font-size: 11px; color: #777; margin-top: 12px; }
    .fc-cf-legend span { display: flex; align-items: center; gap: 5px; }
    .fc-cf-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

    .fc-cat-table { width: 100%; }
    .fc-cat-head { display: grid; grid-template-columns: 130px 1fr 90px 90px 70px; gap: 10px; font-size: 11px; text-transform: uppercase; color: #999; padding-bottom: 8px; border-bottom: 1px solid #ececec; }
    .fc-cat-row { display: grid; grid-template-columns: 130px 1fr 90px 90px 70px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #f4f4f4; font-size: 13px; text-decoration: none; color: #1a1a1a; }
    .fc-cat-row:hover { background: #fafafa; }
    .fc-cat-row:last-child { border-bottom: none; }
    .fc-cat-track { background: #f2f2f2; height: 14px; border-radius: 3px; overflow: hidden; }
    .fc-cat-fill { height: 100%; background: #4a6fa5; border-radius: 3px; }
    .fc-cat-val { text-align: right; font-variant-numeric: tabular-nums; }
    .fc-cat-avg { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
    .fc-cat-delta { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .fc-cat-delta.up { color: #c0392b; }
    .fc-cat-delta.down { color: #1f8a4c; }

    .fc-attn { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .fc-attn-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 10px 12px; border-radius: 6px; background: #fafafa; cursor: pointer; text-decoration: none; color: #1a1a1a; }
    .fc-attn-row:hover { background: #f1f1f1; }
    .fc-attn-row .ic { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .fc-attn-row .txt { flex: 1; }
    .fc-attn-row .go { color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/bills">Bills & Bank</a>
    <a href="/transactions">Transactions</a>
    <a href="/utilities/electricity">Utilities</a>
    <a href="/wiki">Wiki</a>
    <a href="/todos">To-Dos</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
