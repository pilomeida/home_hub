{% extends "base.html" %}
{% block title %}Upload — Bills & Bank{% endblock %}
{% block content %}
<h1>Upload a bill or statement</h1>
<form action="/financials/bills/upload" method="post" enctype="multipart/form-data">
  <select name="account_id">
    <option value="">(no account selected)</option>
    {% for a in accounts %}
    <option value="{{ a.id }}">{{ a.name }}</option>
    {% endfor %}
  </select>
  <input type="file" name="file" required>
    <small class="scan-notice" style="display:block; color:#666; margin-top:4px;">{{ scan_notice }}</small>
  <button type="submit">Upload</button>
</form>
{% endblock %}
