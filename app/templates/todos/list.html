{% extends "base.html" %}
{% block title %}To-Dos{% endblock %}
{% block content %}
<h1>To-Dos</h1>
<form class="card addtodo" hx-post="/todos/add-general" hx-target="#todo-lists" hx-swap="innerHTML" hx-on::after-request="if (event.detail.successful) this.reset()">
  <input name="title" placeholder="Add a to-do that is not tied to a house area (work, a domain name, ...)" required>
  <input type="date" name="due_date">
  <button class="btn pri" type="submit">Add</button>
</form>
<div id="todo-lists">
  {% include "todos/_lists.html" %}
</div>
{% endblock %}
