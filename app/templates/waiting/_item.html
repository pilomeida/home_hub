<div class="card witem" id="review-{{ c.item.id }}">
  <div class="witem-h"><span class="badge">{{ c.area_label }}</span> <strong>{{ c.item.title }}</strong></div>
  <p class="witem-why">{{ c.item.why }}{% if c.item.evidence_url %} <a href="{{ c.item.evidence_url }}">See it</a>{% endif %}</p>
  <form class="btns" hx-post="/waiting/{{ c.item.id }}" hx-target="#review-{{ c.item.id }}" hx-swap="outerHTML">
    {% for o in c.options %}<button type="submit" name="answer" value="{{ o.value }}"{% if loop.first %} class="pri"{% endif %}>{{ o.label }}</button> {% endfor %}
    {% if not c.options and c.item.evidence_url %}<a href="{{ c.item.evidence_url }}">Choose it there</a> {% endif %}
    <button type="submit" name="answer" value="snooze">Ask me in a week</button>
    <label class="hint"><input type="checkbox" name="remember" value="1" checked> Remember this answer</label>
  </form>
</div>
