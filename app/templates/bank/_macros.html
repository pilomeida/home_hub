{# One what / why / what-to-do message (decision D14). `technical` is optional raw detail, collapsed. #}
{% macro problem(p, technical=none) -%}
<strong>{{ p.what }}</strong> {{ p.why }} {{ p.next_step }}{% if p.link %} <a href="{{ p.link }}">Open</a>{% endif %}
{%- if technical %}<details><summary>Technical details</summary><code>{{ technical }}</code></details>{% endif %}
{%- endmacro %}
