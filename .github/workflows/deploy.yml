name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # The whole suite must pass before the server is touched (finding F17). Same Python and the same exact
  # package versions as production (requirements.lock), plus the test tools.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tools the readers call
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 167.233.51.113
          username: home-hub
          key: ${{ secrets.DEPLOY_SSH_KEY_HOMEHUB }}
          script: |
            set -e
            cd /srv/home-hub/app
            git pull --ff-only
            source ../venv/bin/activate
            pip install -r requirements.lock
            # A checked copy of the database first, so a migration that goes wrong can be undone (finding F16).
            python -m app.jobs.backup before-migration
            alembic upgrade head
            sudo /bin/systemctl restart home-hub
            sleep 2
            sudo /bin/systemctl is-active home-hub
            bash deploy/install_user_units.sh
            sleep 3
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            ! systemctl --user is-failed --quiet home-hub-telegram
