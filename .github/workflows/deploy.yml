name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 167.233.51.113
          username: home-hub
          key: ${{ secrets.DEPLOY_SSH_KEY_HOMEHUB }}
          script: |
            set -e
            cd /srv/home-hub/app
            git pull --ff-only
            source ../venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            sudo /bin/systemctl restart home-hub
            sleep 2
            sudo /bin/systemctl is-active home-hub
